let current=0;
let answers=new Array(questions.length).fill(null);

function render(){
 const q=questions[current];
 document.getElementById("questionNumber").textContent=
   `Questão ${current+1} de ${questions.length}`;
 document.getElementById("subjectInfo").textContent=q.subject;
 document.getElementById("progressBar").style.width=
   `${((current+1)/questions.length)*100}%`;

 let html=`<div class="subject">${q.subject}</div>
 <div class="question">${q.text}</div>`;

 if(q.passage) html+=`<div class="text-box">${q.passage}</div>`;
 if(q.image) html+=`<img class="comic" src="${q.image}" alt="Imagem da questão">`;

 if(q.type==="mc" || !q.type){
   html+=`<div class="options">`;
   q.options.forEach((opt,i)=>{
     const selected=answers[current]===i?"selected":"";
     html+=`
       <label class="option ${selected}">
         <input type="radio" name="answer" value="${i}"
          ${answers[current]===i?"checked":""}
          onchange="selectAnswer(${i})">
         <span><strong>${String.fromCharCode(65+i)})</strong> ${opt}</span>
       </label>`;
   });
   html+=`</div>`;
 }
 else if(q.type==="tf"){
   html+=`<div class="options">`;
   ["Verdadeiro","Falso"].forEach((opt,i)=>{
     html+=`<label class="option ${answers[current]===i?"selected":""}">
       <input type="radio" name="answer" value="${i}"
       ${answers[current]===i?"checked":""}
       onchange="selectAnswer(${i})">
       ${opt}
     </label>`;
   });
   html+=`</div>`;
 }
 else if(q.type==="fill"){
   html+=`<input class="fill-input" id="fillAnswer"
     placeholder="Digite sua resposta"
     value="${answers[current]??""}"
     onchange="selectAnswer(this.value)">`;
 }
 else if(q.type==="match"){
   html+=`<div class="options">`;
   q.items.forEach((item,i)=>{
     html+=`<div class="match-row">
       <span>${item}</span>
       <select onchange="selectMatch(${i},this.value)">
         <option value="">Escolha</option>
         ${q.matches.map((m,j)=>`<option value="${j}"
         ${answers[current]?.[i]===j?"selected":""}>${m}</option>`).join("")}
       </select>
     </div>`;
   });
   html+=`</div>`;
 }

 document.getElementById("questionArea").innerHTML=html;
 document.getElementById("prevBtn").disabled=current===0;
 document.getElementById("nextBtn").classList.toggle("hidden",current===questions.length-1);
 document.getElementById("finishBtn").classList.toggle("hidden",current!==questions.length-1);
}

function selectAnswer(value){
 answers[current]=value;
 render();
}

function selectMatch(index,value){
 if(!Array.isArray(answers[current])){
   answers[current]=[];
 }
 answers[current][index]=value===""?null:Number(value);
}

function previousQuestion(){
 if(current>0){current--;render();}
}

function nextQuestion(){
 if(current<questions.length-1){current++;render();}
}

function isCorrect(q,answer){
 if(q.type==="fill"){
   return String(answer??"").trim().toLowerCase()===String(q.answer).trim().toLowerCase();
 }
 if(q.type==="match"){
   return Array.isArray(answer)&&answer.every((v,i)=>v===q.answer[i]);
 }
 return answer===q.answer;
}

function finishQuiz(){
 const unanswered=answers.filter(a=>a===null||a===undefined||
   a===""||(Array.isArray(a)&&a.some(v=>v===null||v===undefined))).length;

 if(unanswered>0){
   const confirmFinish=confirm(`Você ainda tem ${unanswered} questão(ões) sem resposta. Deseja finalizar mesmo assim?`);
   if(!confirmFinish)return;
 }

 let total=0,port=0,mat=0,portTotal=0,matTotal=0;
 questions.forEach((q,i)=>{
   if(q.subject==="Língua Portuguesa")portTotal++;
   else matTotal++;
   if(isCorrect(q,answers[i])){
     total++;
     if(q.subject==="Língua Portuguesa")port++;
     else mat++;
   }
 });

 document.getElementById("quiz").classList.add("hidden");
 const result=document.getElementById("result");
 result.classList.remove("hidden");

 let review="";
 questions.forEach((q,i)=>{
   const correct=isCorrect(q,answers[i]);
   if(!correct){
     let chosen="Não respondida";
     if(answers[i]!==null&&answers[i]!==undefined&&answers[i]!==""){
       if(q.options&&typeof answers[i]==="number"){
         chosen=q.options[answers[i]];
       }else{
         chosen=String(answers[i]);
       }
     }
     const right=q.options?q.options[q.answer]:String(q.answer);
     review+=`
       <div class="review-item">
         <strong>Questão ${i+1} - ${q.subject}</strong><br>
         <span class="wrong">Sua resposta: ${chosen}</span><br>
         <span class="correct">Resposta correta: ${right}</span>
       </div>`;
   }
 });

 result.innerHTML=`
   <h2>Simulado finalizado!</h2>
   <p>Confira seu desempenho:</p>
   <div class="score">${total} / ${questions.length}</div>
   <p>Você acertou ${Math.round(total/questions.length*100)}% das questões.</p>

   <div class="result-box">
     <h3>Língua Portuguesa</h3>
     <strong>${port} de ${portTotal} questões</strong>
   </div>
   <div class="result-box">
     <h3>Matemática</h3>
     <strong>${mat} de ${matTotal} questões</strong>
   </div>
   <div class="result-box">
     <h3>Questões para revisar</h3>
     ${review||"<p class='correct'>Parabéns! Você acertou todas as questões!</p>"}
   </div>
   <button class="primary" onclick="restartQuiz()">Refazer simulado</button>
 `;
 window.scrollTo({top:0,behavior:"smooth"});
}

function restartQuiz(){
 current=0;
 answers=new Array(questions.length).fill(null);
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
